services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry_local
      POSTGRES_DB: laundry
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundry"]
      interval: 3s
      retries: 10
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry_test
      POSTGRES_DB: laundry_test
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
volumes:
  pgdata:
